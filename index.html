<html lang="ja"><head><meta charset="utf-8"><title>mac-backup</title></head>
<body>
<h1>mac-backup</h1>
<p>個人の Mac のバックアップ専用ツールです。運営者本人だけが使います。</p>
<h2 id="privacy">プライバシーポリシー</h2>
<ul>
<li>本人の Mac のファイルを暗号化してから、本人の Google ドライブに保存します。</li>
<li>Google ドライブで扱うのは、このツールが作ったファイルだけです。他のファイルは読みません。</li>
<li>第三者へのデータの提供、収集、販売はしません。</li>
</ul>
</body></html>
